<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#1a1a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5733"/>
      <stop offset="100%" stop-color="#FF8C66"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Chat mockup background -->
  <rect x="900" y="80" width="580" height="680" rx="24" fill="#1e1e28" opacity="0.8"/>
  <rect x="920" y="100" width="540" height="56" rx="12" fill="#2a2a36"/>
  <circle cx="948" cy="128" r="16" fill="url(#accent)"/>
  <text x="976" y="134" fill="#ffffff" font-family="system-ui,sans-serif" font-size="18" font-weight="600">Отклик · администратор</text>
  <circle cx="1130" cy="128" r="5" fill="#4ade80"/>
  <!-- Chat bubbles -->
  <rect x="940" y="190" width="360" height="64" rx="16" fill="#2a2a36"/>
  <text x="960" y="218" fill="#e0e0e8" font-family="system-ui,sans-serif" font-size="15">Здравствуйте! Сколько стоит</text>
  <text x="960" y="238" fill="#e0e0e8" font-family="system-ui,sans-serif" font-size="15">маникюр и когда можно записаться?</text>
  <rect x="1020" y="280" width="420" height="84" rx="16" fill="url(#accent)"/>
  <text x="1040" y="308" fill="#ffffff" font-family="system-ui,sans-serif" font-size="15">Здравствуйте! 💅 Маникюр — от 1500 ₽,</text>
  <text x="1040" y="328" fill="#ffffff" font-family="system-ui,sans-serif" font-size="15">работаем с 10:00 до 21:00. На завтра есть</text>
  <text x="1040" y="348" fill="#ffffff" font-family="system-ui,sans-serif" font-size="15">свободные окна. Оставьте заявку!</text>
  <rect x="940" y="390" width="300" height="44" rx="16" fill="#2a2a36"/>
  <text x="960" y="418" fill="#e0e0e8" font-family="system-ui,sans-serif" font-size="15">Да, давайте! Анна, +7 900 ...</text>
  <!-- Lead card -->
  <rect x="960" y="470" width="480" height="160" rx="16" fill="#2a2a36" stroke="#FF5733" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="988" y="502" fill="#FF5733" font-family="system-ui,sans-serif" font-size="14" font-weight="700">🔥 НОВАЯ ЗАЯВКА → ВЛАДЕЛЬЦУ</text>
  <line x1="988" y1="516" x2="1410" y2="516" stroke="#3a3a46" stroke-width="1"/>
  <text x="988" y="544" fill="#9090a0" font-family="system-ui,sans-serif" font-size="14">Имя</text>
  <text x="1300" y="544" fill="#ffffff" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">Анна</text>
  <text x="988" y="572" fill="#9090a0" font-family="system-ui,sans-serif" font-size="14">Контакт</text>
  <text x="1300" y="572" fill="#ffffff" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">+7 900 123-45-67</text>
  <text x="988" y="600" fill="#9090a0" font-family="system-ui,sans-serif" font-size="14">Запрос</text>
  <text x="1300" y="600" fill="#ffffff" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">Маникюр, завтра</text>
  <!-- Left side text -->
  <text x="100" y="200" fill="#9090a0" font-family="system-ui,sans-serif" font-size="16" letter-spacing="3" text-transform="uppercase">AI-АДМИНИСТРАТОР</text>
  <text x="100" y="300" fill="#ffffff" font-family="system-ui,sans-serif" font-size="72" font-weight="800">Ни одной</text>
  <text x="100" y="390" fill="url(#accent)" font-family="system-ui,sans-serif" font-size="72" font-weight="800" font-style="italic">потерянной</text>
  <text x="100" y="480" fill="#ffffff" font-family="system-ui,sans-serif" font-size="72" font-weight="800">заявки.</text>
  <text x="100" y="560" fill="#9090a0" font-family="system-ui,sans-serif" font-size="20" opacity="0.8">Бот отвечает клиентам за 15 секунд, 24/7.</text>
  <text x="100" y="592" fill="#9090a0" font-family="system-ui,sans-serif" font-size="20" opacity="0.8">Собирает заявки и передаёт владельцу.</text>
  <!-- Stats -->
  <text x="100" y="700" fill="url(#accent)" font-family="system-ui,sans-serif" font-size="42" font-weight="700">15с</text>
  <text x="100" y="730" fill="#9090a0" font-family="system-ui,sans-serif" font-size="14">средний ответ</text>
  <text x="280" y="700" fill="url(#accent)" font-family="system-ui,sans-serif" font-size="42" font-weight="700">24/7</text>
  <text x="280" y="730" fill="#9090a0" font-family="system-ui,sans-serif" font-size="14">без выходных</text>
  <text x="460" y="700" fill="url(#accent)" font-family="system-ui,sans-serif" font-size="42" font-weight="700">0 ₽</text>
  <text x="460" y="730" fill="#9090a0" font-family="system-ui,sans-serif" font-size="14">навсегда</text>
</svg>
