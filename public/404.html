<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070D">
  <meta name="robots" content="noindex">
  <meta name="description" content="Страница не найдена — Verto Studio.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Страница не найдена — Verto Studio</title>
  <style>
    @font-face { font-family: 'Unbounded'; font-weight: 800; font-display: swap; src: url('/fonts/unbounded-latin-800-normal.woff2') format('woff2'); unicode-range: U+0000-00FF; }
    @font-face { font-family: 'Unbounded'; font-weight: 800; font-display: swap; src: url('/fonts/unbounded-cyrillic-800-normal.woff2') format('woff2'); unicode-range: U+0400-045F; }
    @font-face { font-family: 'Golos Text'; font-weight: 400; font-display: swap; src: url('/fonts/golos-text-cyrillic-400-normal.woff2') format('woff2'); unicode-range: U+0400-045F; }
    @font-face { font-family: 'Golos Text'; font-weight: 400; font-display: swap; src: url('/fonts/golos-text-latin-400-normal.woff2') format('woff2'); unicode-range: U+0000-00FF; }
    @font-face { font-family: 'Golos Text'; font-weight: 600; font-display: swap; src: url('/fonts/golos-text-cyrillic-600-normal.woff2') format('woff2'); unicode-range: U+0400-045F; }
    :root { --bg: #05070D; --text: #EEF1F6; --text-dim: #A6AFC0; --accent: #FF6B2C; --accent-hover: #FF8A55; --on-accent: #05070D; color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100svh; display: grid; place-items: center; padding: 40px 20px; color: var(--text); font: 400 1.0625rem/1.55 'Golos Text', system-ui, sans-serif;
      background: radial-gradient(120% 70% at 80% -10%, #121A2B, transparent 60%), linear-gradient(var(--bg), #020306 85%); }
    main { max-width: 34rem; text-align: center; }
    .code { font: 800 clamp(5rem, 22vw, 10rem)/0.9 'Unbounded', sans-serif; letter-spacing: -0.04em; color: var(--accent); }
    h1 { margin-top: 20px; font: 800 clamp(1.75rem, 6vw, 2.75rem)/1.05 'Unbounded', sans-serif; letter-spacing: -0.02em; text-wrap: balance; }
    p { margin: 20px auto 32px; color: var(--text-dim); max-width: 44ch; text-wrap: pretty; }
    a { display: inline-flex; align-items: center; min-height: 56px; padding: 0 1.6em; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; transition: background-color 180ms cubic-bezier(0.23, 1, 0.32, 1), transform 120ms cubic-bezier(0.23, 1, 0.32, 1); }
    a:active { transform: scale(0.97); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (hover: hover) and (pointer: fine) { a:hover { background: var(--accent-hover); } }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Страница не найдена</h1>
    <p>Возможно, адрес изменился или в ссылке есть ошибка. Вернитесь на главную и продолжите знакомство со студией.</p>
    <a href="/">Вернуться на главную</a>
  </main>
</body>
</html>
